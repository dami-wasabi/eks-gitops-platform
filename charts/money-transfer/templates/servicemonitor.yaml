{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "money-transfer.fullname" . }}
  labels:
    {{- include "money-transfer.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Every series gets job="<service name>", which the SLO rules select on.
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      {{- include "money-transfer.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
