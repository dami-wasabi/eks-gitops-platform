{{- if .Values.networkPolicy.enabled }}
# Default-deny for the app pods: traffic in only from the gateway proxies,
# traffic out only to cluster DNS. The service needs nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "money-transfer.fullname" . }}
  labels:
    {{- include "money-transfer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "money-transfer.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
