{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "money-transfer.fullname" . }}
  labels:
    {{- include "money-transfer.labels" . | nindent 4 }}
  annotations:
    # Gateway API CRDs are installed by another Argo CD app; don't fail the
    # whole sync while they're still arriving.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "money-transfer.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
