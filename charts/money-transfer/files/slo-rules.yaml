# Service level objectives for money-transfer, over a rolling 30 days:
#
#   Availability: 99.5% of quote requests succeed (not 5xx)  -> 0.5% error budget
#   Latency:      99%   of quote requests finish in < 300 ms -> 1%   error budget
#
# Alerting uses multi-window, multi-burn-rate rules (Google SRE Workbook, ch. 5).
# "Burn rate" is how fast the budget is being spent relative to plan: a burn
# rate of 1 uses exactly the whole budget in 30 days; 14.4 uses 2% of it in an
# hour. Each alert needs BOTH a long window (is this significant?) and a short
# window (is it still happening?), which keeps alerts fast to fire, quick to
# clear, and free of noise from brief blips.
#
#   severity=page    14.4x over 1h and 5m   (2% of budget gone in 1 hour)
#                    6x    over 6h and 30m  (5% of budget gone in 6 hours)
#   severity=ticket  3x    over 1d and 2h   (10% of budget gone in 1 day)
#                    1x    over 3d and 6h   (on track to miss the SLO)
#
# This file is plain Prometheus rule syntax so `promtool test rules` can test it
# directly (see slo-tests.yaml); the Helm chart embeds it in a PrometheusRule.
groups:
  - name: money-transfer-slo-sli
    rules:
      # ---- Availability SLI: share of quote requests that failed with a 5xx ----
      # "or on() vector(0)": when nothing has failed yet, the 5xx series doesn't
      # exist at all; without this the ratio would be empty instead of 0.
      - record: slo:availability_errors:ratio_rate5m
        expr: |
          (
            sum(rate(http_requests_total{job="money-transfer", route="/api/quote", status=~"5.."}[5m]))
            or on() vector(0)
          )
          /
          sum(rate(http_requests_total{job="money-transfer", route="/api/quote"}[5m]))
      - record: slo:availability_errors:ratio_rate30m
        expr: |
          (
            sum(rate(http_requests_total{job="money-transfer", route="/api/quote", status=~"5.."}[30m]))
            or on() vector(0)
          )
          /
          sum(rate(http_requests_total{job="money-transfer", route="/api/quote"}[30m]))
      - record: slo:availability_errors:ratio_rate1h
        expr: |
          (
            sum(rate(http_requests_total{job="money-transfer", route="/api/quote", status=~"5.."}[1h]))
            or on() vector(0)
          )
          /
          sum(rate(http_requests_total{job="money-transfer", route="/api/quote"}[1h]))
      - record: slo:availability_errors:ratio_rate2h
        expr: |
          (
            sum(rate(http_requests_total{job="money-transfer", route="/api/quote", status=~"5.."}[2h]))
            or on() vector(0)
          )
          /
          sum(rate(http_requests_total{job="money-transfer", route="/api/quote"}[2h]))
      - record: slo:availability_errors:ratio_rate6h
        expr: |
          (
            sum(rate(http_requests_total{job="money-transfer", route="/api/quote", status=~"5.."}[6h]))
            or on() vector(0)
          )
          /
          sum(rate(http_requests_total{job="money-transfer", route="/api/quote"}[6h]))
      - record: slo:availability_errors:ratio_rate1d
        expr: |
          (
            sum(rate(http_requests_total{job="money-transfer", route="/api/quote", status=~"5.."}[1d]))
            or on() vector(0)
          )
          /
          sum(rate(http_requests_total{job="money-transfer", route="/api/quote"}[1d]))
      - record: slo:availability_errors:ratio_rate3d
        expr: |
          (
            sum(rate(http_requests_total{job="money-transfer", route="/api/quote", status=~"5.."}[3d]))
            or on() vector(0)
          )
          /
          sum(rate(http_requests_total{job="money-transfer", route="/api/quote"}[3d]))
      - record: slo:availability_errors:ratio_rate30d
        expr: |
          (
            sum(rate(http_requests_total{job="money-transfer", route="/api/quote", status=~"5.."}[30d]))
            or on() vector(0)
          )
          /
          sum(rate(http_requests_total{job="money-transfer", route="/api/quote"}[30d]))

      # ---- Latency SLI: share of quote requests slower than 300 ms ----
      # 0.3 is a histogram bucket edge in the app, so this is exact, not interpolated.
      - record: slo:latency_errors:ratio_rate5m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="money-transfer", route="/api/quote", le="0.3"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="money-transfer", route="/api/quote"}[5m]))
          )
      - record: slo:latency_errors:ratio_rate30m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="money-transfer", route="/api/quote", le="0.3"}[30m]))
            /
            sum(rate(http_request_duration_seconds_count{job="money-transfer", route="/api/quote"}[30m]))
          )
      - record: slo:latency_errors:ratio_rate1h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="money-transfer", route="/api/quote", le="0.3"}[1h]))
            /
            sum(rate(http_request_duration_seconds_count{job="money-transfer", route="/api/quote"}[1h]))
          )
      - record: slo:latency_errors:ratio_rate6h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="money-transfer", route="/api/quote", le="0.3"}[6h]))
            /
            sum(rate(http_request_duration_seconds_count{job="money-transfer", route="/api/quote"}[6h]))
          )
      - record: slo:latency_errors:ratio_rate30d
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="money-transfer", route="/api/quote", le="0.3"}[30d]))
            /
            sum(rate(http_request_duration_seconds_count{job="money-transfer", route="/api/quote"}[30d]))
          )

  - name: money-transfer-slo-alerts
    rules:
      - alert: QuoteAvailabilityBudgetBurnFast
        expr: |
          (
            slo:availability_errors:ratio_rate1h > (14.4 * 0.005)
            and
            slo:availability_errors:ratio_rate5m > (14.4 * 0.005)
          )
          or
          (
            slo:availability_errors:ratio_rate6h > (6 * 0.005)
            and
            slo:availability_errors:ratio_rate30m > (6 * 0.005)
          )
        for: 2m
        labels:
          severity: page
          slo: quote-availability
        annotations:
          summary: Quote errors are burning the 30-day availability budget fast
          description: More than 2% of the monthly error budget is being spent per hour. At this rate the 99.5% availability SLO will be missed within days. Act now.
          runbook_url: https://github.com/dami-wasabi/eks-gitops-platform/blob/main/docs/runbooks/quote-availability.md

      - alert: QuoteAvailabilityBudgetBurnSlow
        expr: |
          (
            slo:availability_errors:ratio_rate1d > (3 * 0.005)
            and
            slo:availability_errors:ratio_rate2h > (3 * 0.005)
          )
          or
          (
            slo:availability_errors:ratio_rate3d > (1 * 0.005)
            and
            slo:availability_errors:ratio_rate6h > (1 * 0.005)
          )
        for: 15m
        labels:
          severity: ticket
          slo: quote-availability
        annotations:
          summary: Quote errors are steadily eroding the availability budget
          description: The error rate is high enough to exhaust the monthly budget before the 30-day window ends. Investigate during working hours.
          runbook_url: https://github.com/dami-wasabi/eks-gitops-platform/blob/main/docs/runbooks/quote-availability.md

      - alert: QuoteLatencyBudgetBurnFast
        expr: |
          (
            slo:latency_errors:ratio_rate1h > (14.4 * 0.01)
            and
            slo:latency_errors:ratio_rate5m > (14.4 * 0.01)
          )
          or
          (
            slo:latency_errors:ratio_rate6h > (6 * 0.01)
            and
            slo:latency_errors:ratio_rate30m > (6 * 0.01)
          )
        for: 2m
        labels:
          severity: page
          slo: quote-latency
        annotations:
          summary: Slow quotes are burning the 30-day latency budget fast
          description: Too many quote requests are taking longer than 300 ms. At this rate the 99% latency SLO will be missed within days. Act now.
          runbook_url: https://github.com/dami-wasabi/eks-gitops-platform/blob/main/docs/runbooks/quote-latency.md
