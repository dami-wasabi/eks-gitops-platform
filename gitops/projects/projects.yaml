# Two Argo CD projects keep platform components and workloads apart:
# workloads can only deploy from this repo into their own namespace and can't
# create cluster-wide resources (other than their Namespace).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster-wide platform components (gateway, metrics, monitoring)
  sourceRepos:
    - https://github.com/dami-wasabi/eks-gitops-platform.git
    - registry-1.docker.io/envoyproxy
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Business applications
  sourceRepos:
    - https://github.com/dami-wasabi/eks-gitops-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: money-transfer
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
