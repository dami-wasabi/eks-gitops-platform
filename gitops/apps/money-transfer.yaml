apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: money-transfer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: apps
  source:
    repoURL: https://github.com/dami-wasabi/eks-gitops-platform.git
    targetRevision: main
    path: charts/money-transfer
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: money-transfer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # Enforce the Kubernetes "restricted" Pod Security Standard.
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        # Allowed to attach routes to the public Gateway.
        gateway-access: public
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
